name = "chalak-functions"
main = "src/index.ts"
compatibility_date = "2025-09-25"

# Account ID — use CLOUDFLARE_ACCOUNT_ID env var in CI/production
# account_id = "your-account-id"

# ============================================
# Environment
# ============================================

[vars]
ENVIRONMENT = "development"
FRONTEND_URL = "http://localhost:5173"

# ============================================
# D1 Database
# For production, provision a D1 database:
#   npx wrangler d1 create chalak-intelligence-d1
# Then replace database_id with the real UUID.
# ============================================

d1_databases = [
  { binding = "DB", database_name = "chalak-intelligence-d1", database_id = "local" }
]

# ============================================
# R2 Bucket (for file storage)
# ============================================

r2_buckets = [
  { binding = "R2", bucket_name = "chalak-intelligence-r2" }
]

# ============================================
# Durable Objects (for real-time collaboration)
# CollabRoom is a scaffold — full real-time collab
# arrives in Phase 2. The class is exported and
# declared here so the DO namespace is provisioned.
# ============================================

[durable_objects]
bindings = [
  { name = "COLLAB", class_name = "CollabRoom" }
]

[exports.CollabRoom]
type = "durable-object"
storage = "sqlite"

# ============================================
# Triggers
# ============================================

[triggers]
crons = ["0 * * * *"]
